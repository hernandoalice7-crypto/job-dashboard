# =====================================================
# MES PRÉFÉRENCES DE RECHERCHE
# Pour modifier : change le texte après les deux-points.
# Les lignes qui commencent par # sont des commentaires.
# Attention : garde bien les espaces au début des lignes.
# =====================================================

# ---------- TYPE DE CONTRAT ----------
contrat:
  duree_max_mois: 6
  types_acceptes:
    - stage
    - vie
    - graduate
  type_prefere: stage

# ---------- DATES DE DÉBUT ----------
dates:
  debut_min: "2027-03-22"
  debut_max: "2027-07-31"
  avant_examens_du: "2027-03-01"
  avant_examens_au: "2027-03-21"
  garder_si_date_inconnue: true

# ---------- MÉTIERS ----------
metiers:
  # Priorité : ces mots dans le titre donnent le maximum de points
  prioritaires:
    - consultant stratégie
    - consultante stratégie
    - conseil en stratégie
    - conseil en entreprise
    - strategy consultant
    - strategy consulting
    - associate consultant
    - business analyst
    - stratégie corporate
    - stratégie d'entreprise
    - corporate strategy
    - business strategy
    - strategy intern
    - strategy & operations
    - competitive intelligence
    - veille concurrentielle
    - innovation strategy
    - stagiaire consultant
    - consultant stagiaire
    - analyste stratégie
  # Second choix : moins de points
  acceptables:
    - transformation
    - transformation consultant
    - conseil en transformation
    - finance transformation
    - pmo
    - change management
    - conduite du changement
    - due diligence
    - transaction services
    - deal advisory
    - m&a
    - private equity
    - venture capital
    - esg
    - sustainability
    - climate
    - transition écologique
    - impact investing
    - data strategy
    - digital strategy
    - politiques publiques
    - paiements
    - fintech
    - conseil interne
    - ingénieur d'affaires
    - stratégie
    - strategy
  # Petit bonus de score si ces mots apparaissent dans l'offre
  bonus:
    - due diligence
    - m&a
    - fusion
    - acquisition
    - private equity
    - transition écologique
    - esg
    - direction financière
    - procurement
    - achats
  # EXCLUS : une offre avec un de ces mots dans le titre est retirée
  exclus:
    - audit
    - auditeur
    - commissaire aux comptes
    - senior
    - manager
    - directeur
    - alternance
    - apprentissage
    - cdi
    - freelance
    # Vente pure (non souhaitée)
    - account executive
    - sales representative
    - sales intern
    - business developer
    - vendeur
    - téléconseiller
  # Ces mots ne retirent PAS une offre si le titre contient « stage », « stagiaire »
  # ou « intern » (« Project Manager Intern » est gardé, « Manager » seul est retiré)
  exclus_sauf_si_stage:
    - manager
    - senior
    - directeur

# ---------- LIEUX ----------
lieux:
  paris:                       # priorité 1
    - paris
    - île-de-france
    - ile-de-france
    - la défense
    - la defense
    - neuilly
    - boulogne
    - levallois
    - issy
    - pantin
    - courbevoie
  lyon_lille:                  # priorité 2
    - lyon
    - lille
  suisse:                      # priorité 3 (permis de travail à vérifier)
    - suisse
    - switzerland
    - genève
    - geneva
    - zurich
    - lausanne
    - bâle
    - basel
  exclus:                      # villes refusées
    - nantes
  garder_si_lieu_inconnu: true

# ---------- LANGUES ----------
langues:
  rédhibitoires:
    - allemand
    - german
    - deutsch
    - néerlandais
    - dutch
    - italien courant
    - mandarin

# ---------- ENTREPRISES ET SECTEURS ----------
entreprises_exclues: []

# ---------- SALAIRE ----------
salaire:
  minimum: 0

# ---------- SCORE SUR 100 ----------
score:
  metier: 35
  contrat: 15
  date_debut: 15
  lieu: 15
  fraicheur: 10
  mots_bonus: 5
  salaire_affiche: 5

# ---------- SOURCES ----------
sources:
  consultor: true
  linkedin: true
  carrieres: true
  welcome_to_the_jungle: false # pas encore installée
  france_travail: false        # pas encore installée (clé gratuite à créer)
  business_france_vie: false   # pas encore installée
  jobteaser: false

# Pages carrières à suivre (à compléter ensemble)
# Format : "identifiant" ou "identifiant|Nom affiché"
entreprises_suivies:
  greenhouse: []
  lever: []
  ashby: []
  smartrecruiters: []
  workday: []

# ---------- NOTIFICATION ----------
notifications:
  email_si_nouvelles_offres: true

